[package]
name = "bitmagnet-torznab"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
bitmagnet-common = { path = "../bitmagnet-common" }
bitmagnet-search-query = { path = "../bitmagnet-search-query" }
anyhow = { workspace = true }
async-trait = "0.1"
axum = "0.8"
chrono = "0.4"
form_urlencoded = "1"
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# Only the Lane G golden smoke test parses XML; the serializer is hand-rolled
# for byte-exact Go `encoding/xml` parity, so quick-xml is test-only.
quick-xml = "0.39"
serde_json = { workspace = true }
tower = { version = "0.5", features = ["util"] }
