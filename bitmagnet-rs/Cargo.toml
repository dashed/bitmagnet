[workspace]
resolver = "2"
members = [
    "crates/bitmagnet-proto",
    "crates/bitmagnet-common",
    "crates/bitmagnet-model",
    "crates/bitmagnet-db",
    "crates/bitmagnet-search",
    "crates/bitmagnet-parquet",
    "crates/bitmagnet-filesearch",
    "crates/bitmagnet-shadow",
    "crates/bitmagnet-diff",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["bitmagnet contributors"]
repository = "https://github.com/bitmagnet-io/bitmagnet"

# Centrally pinned dependency versions. A member crate opts in with, e.g.,
# `tonic.workspace = true` and may *add* features locally (features are
# additive). Versions verified against crates.io on 2026-05-28 with the
# toolchain rustc/cargo 1.95.0.
[workspace.dependencies]
# gRPC / protobuf. tonic 0.14 split the prost-specific codec + codegen out of
# `tonic` / `tonic-build` into the `tonic-prost` (runtime) and
# `tonic-prost-build` (build script) crates.
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"

# Async runtime.
tokio = { version = "1", features = ["full"] }

# Observability.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Prometheus client_golang analog with exact metric-name, label, and bucket
# control for dashboard compatibility.
prometheus = { version = "0.14", features = ["process"] }

# Error handling.
thiserror = "2"
anyhow = "1"

# Serialization + file-blob format (MessagePack -> ZSTD, mirrors the Go
# `internal/blobmigration` serializer).
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
zstd = "0.13"
# JSON — currently test-only (the tokenizer parity fixtures); pinned centrally
# so member crates reference it via `serde_json.workspace = true`.
serde_json = "1"

# Layered config provider-stack selected in
# docs/dev/rust-rewrite/03-ecosystem-mapping.md §7 (defaults < file < env).
# The explicit strcase env-key mapping, not Figment, is the compatibility contract.
figment = { version = "0.10", features = ["yaml", "env"] }

# Database. NOTE: sqlx 0.7+ split the combined `runtime-tokio-rustls` feature
# into separate `runtime-*` and `tls-*` features.
sqlx = { version = "0.9", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "macros",
    "json",
] }

# Search engine. 0.26 is the upstream target that motivated the sidecar (the
# tantivy-go FFI bindings are pinned to 0.22).
tantivy = "0.26"
fst = "0.4"
memmap2 = "0.9"

# CLI.
clap = { version = "4", features = ["derive", "env"] }

# Columnar export (L2 — bitmagnet-parquet). 55.x (not the bench's 53.x: arrow
# 53's `arrow-arith` fails to compile against chrono ≥0.4.45 — a `quarter`
# method-ambiguity fixed in arrow 54+). `parquet` opts into arrow + zstd so the
# fact/rollup files are ZSTD-compressed Arrow.
arrow = "55"
parquet = { version = "55", features = ["arrow", "zstd"] }

# Embedded analytical engine for the file-search sidecar (L2b —
# bitmagnet-filesearch). `bundled` statically compiles libduckdb (needs a C++
# toolchain), so it is opt-in behind that crate's `duckdb-engine` feature; the
# default workspace build/test never compiles it.
# 🚨 `parquet` is LOAD-BEARING: it statically compiles the parquet extension
# into the bundled libduckdb. Without it `read_parquet` is not in the catalog
# and the FB-B1d lockdown (autoinstall/autoload=false) rightly blocks loading
# it at runtime — every sidecar query fails (caught by the FSN1 duck-e2e run;
# the l2-1/l2-2 images shipped without it and cannot serve).
duckdb = { version = "1.3", features = ["bundled", "parquet"] }

# Async stream combinators (client-streaming gRPC, DB row streams).
futures = "0.3"
# UDS / TCP listener wrappers for the gRPC transport.
tokio-stream = { version = "0.1", features = ["net"] }
# Hex for info-hash <-> text at the export/Parquet boundary.
hex = "0.4"

# Lints inherited by every member via `[lints] workspace = true`. Kept at
# `warn` (not `deny`) so local builds stay green; CI can promote to `-D
# warnings`.
[workspace.lints.rust]
rust_2018_idioms = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = "warn"
