[package]
name = "bitmagnet-search-serve"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = ["lane-s-stub"]
lane-s-stub = []

[dependencies]
bitmagnet-common = { path = "../bitmagnet-common" }
bitmagnet-model = { path = "../bitmagnet-model" }
bitmagnet-proto = { path = "../bitmagnet-proto" }
async-trait = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true, features = ["transport"] }
tonic-prost = { workspace = true }
tower = "0.5"
tracing = { workspace = true }

[lints]
workspace = true
