version: "2"
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - contextcheck
    - copyloopvar
    #    - cyclop
    #    - dupl
    - durationcheck
    #    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exptostd
    - fatcontext
    - forbidigo
    #    - forcetypeassert
    #    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecksumtype
    #    - gocognit
    - goconst
    - gocritic
    #    - gocyclo
    #    - godot
    #    - godox
    - gomoddirectives
    - goprintffuncname
    #    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - ineffassign
    - intrange
    - loggercheck
    #    - maintidx
    - makezero
    - mirror
    - musttag
    #    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    #    - promlinter
    - protogetter
    - reassign
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - testifylint
    #    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    revive:
      rules:
        - name: argument-limit
        - name: blank-imports
        - name: bool-literal-in-expr
        - name: confusing-results
        - name: constant-logical-expr
        - name: context-as-argument
        - name: context-keys-type
        - name: deep-exit
        - name: defer
        - name: dot-imports
          arguments:
            - allowedPackages:
                - github.com/onsi/ginkgo/v2
                - github.com/onsi/gomega
        - name: duplicated-imports
        - name: early-return
        - name: empty-block
        - name: empty-lines
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: if-return
        - name: identical-branches
        - name: increment-decrement
        - name: indent-error-flow
        - name: nested-structs
        - name: package-comments
        - name: range
        - name: range-val-address
        - name: range-val-in-closure
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: string-of-int
        - name: struct-tag
        - name: superfluous-else
        - name: time-naming
        - name: unconditional-recursion
        - name: unexported-naming
        - name: unexported-return
        - name: unhandled-error
        - name: unnecessary-stmt
        - name: unreachable-code
        - name: unused-parameter
        - name: unused-receiver
        - name: var-declaration
        - name: var-naming
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - unused
        path: internal/protocol/dht/ktable/(.+)\.go
      # The Alberto fork integration brings in experimental blob-migration,
      # file-search, and path-search tracks that predate this repo's current
      # strict Go lint policy. Keep the CI repair scoped to those tracks rather
      # than rewriting broad test/helper code as part of the integration merge.
      - linters:
          - errchkjson
        path: internal/database/search/criteria_torrent_file_extension\.go
      - linters:
          - revive
          - testifylint
        path: internal/database/search/criteria_torrent_content_(published_at|size).*\.go
      - linters:
          - gocritic
          - prealloc
          - revive
        path: internal/blobmigration/(.+)\.go
      - linters:
          - gosmopolitan
          - revive
        path: internal/search/filesearch/(.+)\.go
      - linters:
          - nilnil
        path: internal/search/searchfx/pathsearch_config_test\.go
      - linters:
          - prealloc
          - revive
          - unconvert
        path: internal/search/pathsearch/(.+)\.go
      # Parity/oracle harnesses intentionally preserve fixture-shaped literals,
      # exact error identity, and source-contract control flow. Keep those
      # non-production style findings scoped to the harness files while retaining
      # actionable error checking, tagging, helper, and assignment diagnostics.
      - linters:
          - errname
          - errorlint
          - goconst
          - gocritic
          - intrange
          - mirror
          - prealloc
          - predeclared
          - revive
        path: (_parity(_gen)?|_oracle_gen)_test\.go$
      - linters:
          - staticcheck
        path: (_parity(_gen)?|_oracle_gen)_test\.go$
        text: '^(QF1003|QF1008|S1009|SA1019|ST1008|ST1012|SA6001):'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
