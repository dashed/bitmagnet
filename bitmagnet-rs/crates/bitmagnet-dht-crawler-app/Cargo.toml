[package]
name = "bitmagnet-dht-crawler-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Bounded process ownership for the writer-capable Rust DHT crawler."

[[bin]]
name = "bitmagnet-dht-crawler"
path = "src/main.rs"
doc = false

[dependencies]
bitmagnet-common = { path = "../bitmagnet-common" }
bitmagnet-blocking = { path = "../bitmagnet-blocking" }
bitmagnet-db = { path = "../bitmagnet-db" }
bitmagnet-dht = { path = "../bitmagnet-dht" }
bitmagnet-dht-crawler = { path = "../bitmagnet-dht-crawler" }
axum = "0.8"
anyhow.workspace = true
clap.workspace = true
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
async-trait.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
