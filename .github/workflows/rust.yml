name: Rust

# Rust workspace lives under bitmagnet-rs/ in this polyglot monorepo, so this
# pipeline is scoped to that subtree, the shared Go/Rust tape parity surface,
# and to its own workflow file.
#
# Future work: the Go pipeline (.github/workflows/checks.yml) runs inside
# `nix develop` + `task`. Once the Rust toolchain is added to the repo's Nix
# flake and Taskfile, these jobs should converge on the same `nix develop`
# invocation instead of dtolnay/rust-toolchain + arduino/setup-protoc.

on:
  push:
    branches: [main, develop, alberto/my-fork]
    paths:
      - "bitmagnet-rs/**"
      - "go.mod"
      - "go.sum"
      - "**/*.go"
      - "main.go"
      - "internal/app/cmd/classifiercmd/**"
      - "internal/classifier/**"
      - "internal/gql/**"
      - "internal/model/**"
      - "internal/processor/**"
      - "internal/tape/**"
      - "migrations/**"
      - "testdata/parity/classifier-attach/**"
      - "testdata/parity/classifier-tape-rerun/**"
      - "testdata/parity/graphql-torrent-files/**"
      - "testdata/parity/queue/**"
      - "testdata/parity/torznab/**"
      - "testdata/parity/migrations.golden"
      - "Makefile"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "bitmagnet-rs/**"
      - "go.mod"
      - "go.sum"
      - "**/*.go"
      - "main.go"
      - "internal/app/cmd/classifiercmd/**"
      - "internal/classifier/**"
      - "internal/gql/**"
      - "internal/model/**"
      - "internal/processor/**"
      - "internal/tape/**"
      - "migrations/**"
      - "testdata/parity/classifier-attach/**"
      - "testdata/parity/classifier-tape-rerun/**"
      - "testdata/parity/graphql-torrent-files/**"
      - "testdata/parity/queue/**"
      - "testdata/parity/torznab/**"
      - "testdata/parity/migrations.golden"
      - "Makefile"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: bitmagnet-rs

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bitmagnet-rs
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bitmagnet-rs
      - run: cargo test --workspace

  docker:
    name: docker build (search sidecar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: bitmagnet-rs
          file: bitmagnet-rs/docker/Dockerfile.search
          push: false
          tags: bitmagnet-search:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-filesearch:
    name: docker build (filesearch sidecar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: bitmagnet-rs
          file: bitmagnet-rs/docker/Dockerfile.filesearch
          push: false
          tags: bitmagnet-filesearch:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-graphql:
    name: docker build and smoke (GraphQL read API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact source identity
        id: source
        working-directory: ${{ github.workspace }}
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: bitmagnet-rs
          file: bitmagnet-rs/docker/Dockerfile.graphql
          platforms: linux/amd64
          push: false
          load: true
          tags: bitmagnet-graphql:ci
          build-args: |
            REVISION=${{ steps.source.outputs.commit }}
            SOURCE_TREE=${{ steps.source.outputs.tree }}
          cache-from: type=gha,scope=graphql
          cache-to: type=gha,mode=max,scope=graphql
      - name: Verify image contract and executable smoke
        working-directory: ${{ github.workspace }}
        env:
          EXPECTED_COMMIT: ${{ steps.source.outputs.commit }}
          EXPECTED_TREE: ${{ steps.source.outputs.tree }}
        run: |
          image=bitmagnet-graphql:ci
          inspect="$(mktemp)"
          docker image inspect "$image" | tee "$inspect"
          jq -e --arg commit "$EXPECTED_COMMIT" --arg tree "$EXPECTED_TREE" '
            length == 1 and
            .[0].Os == "linux" and
            .[0].Architecture == "amd64" and
            .[0].Config.User == "65532:65532" and
            .[0].Config.Entrypoint == ["/usr/local/bin/bitmagnet-graphql"] and
            (.[0].Config.Cmd == null or .[0].Config.Cmd == []) and
            (.[0].Config.ExposedPorts | keys) == ["3337/tcp", "9090/tcp"] and
            .[0].Config.Labels["org.opencontainers.image.source"] == "https://github.com/dashed/bitmagnet" and
            .[0].Config.Labels["org.opencontainers.image.revision"] == $commit and
            .[0].Config.Labels["io.bitmagnet.source-tree"] == $tree and
            .[0].Config.Labels["io.bitmagnet.graphql-mode"] == "read-only" and
            .[0].Config.Labels["io.bitmagnet.graphql-read-contract"] == "read-only/v1" and
            (.[0].Config.Env | index("BITMAGNET_SOURCE_COMMIT=" + $commit)) != null and
            (.[0].Config.Env | index("BITMAGNET_SOURCE_TREE=" + $tree)) != null
          ' "$inspect"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65532:65532 "$image" --help \
            | grep -F 'Usage: bitmagnet-graphql'

  docker-ingest-shadow:
    name: docker build (ingest shadow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: bitmagnet-rs/docker/Dockerfile.ingest-shadow
          push: false
          tags: bitmagnet-ingest-shadow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-process-torrent-batch:
    name: docker build and smoke (process_torrent_batch worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact source identity
        id: source
        working-directory: ${{ github.workspace }}
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: bitmagnet-rs/docker/Dockerfile.process-torrent-batch
          platforms: linux/amd64
          push: false
          load: true
          tags: bitmagnet-process-torrent-batch:ci
          build-args: |
            REVISION=${{ steps.source.outputs.commit }}
            SOURCE_TREE=${{ steps.source.outputs.tree }}
          cache-from: type=gha,scope=process-torrent-batch
          cache-to: type=gha,mode=max,scope=process-torrent-batch
      - name: Verify image contract and executable smoke
        working-directory: ${{ github.workspace }}
        env:
          EXPECTED_COMMIT: ${{ steps.source.outputs.commit }}
          EXPECTED_TREE: ${{ steps.source.outputs.tree }}
        run: |
          image=bitmagnet-process-torrent-batch:ci
          inspect="$(mktemp)"
          docker image inspect "$image" | tee "$inspect"
          jq -e --arg commit "$EXPECTED_COMMIT" --arg tree "$EXPECTED_TREE" '
            length == 1 and
            .[0].Os == "linux" and
            .[0].Architecture == "amd64" and
            .[0].Config.User == "65532:65532" and
            .[0].Config.Entrypoint == ["/usr/local/bin/bitmagnet-process-torrent-batch"] and
            (.[0].Config.Cmd == null or .[0].Config.Cmd == []) and
            (.[0].Config.ExposedPorts | keys) == ["9090/tcp"] and
            .[0].Config.Labels["org.opencontainers.image.source"] == "https://github.com/dashed/bitmagnet" and
            .[0].Config.Labels["org.opencontainers.image.revision"] == $commit and
            .[0].Config.Labels["io.bitmagnet.source-tree"] == $tree and
            .[0].Config.Labels["io.bitmagnet.queue-consumer"] == "process_torrent_batch" and
            .[0].Config.Labels["io.bitmagnet.queue-consumer-contract"] == "process_torrent_batch/v1" and
            (.[0].Config.Env | index("BITMAGNET_SOURCE_COMMIT=" + $commit)) != null and
            (.[0].Config.Env | index("BITMAGNET_SOURCE_TREE=" + $tree)) != null
          ' "$inspect"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65532:65532 "$image" --help \
            | grep -F 'Usage: bitmagnet-process-torrent-batch'

  docker-dht-observe:
    name: docker build and smoke (DHT observer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact source identity
        id: source
        working-directory: ${{ github.workspace }}
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: bitmagnet-rs
          file: bitmagnet-rs/docker/Dockerfile.dht-observe
          platforms: linux/amd64
          push: false
          load: true
          tags: bitmagnet-dht-observe:ci
          build-args: |
            REVISION=${{ steps.source.outputs.commit }}
            SOURCE_TREE=${{ steps.source.outputs.tree }}
          cache-from: type=gha,scope=dht-observe
          cache-to: type=gha,mode=max,scope=dht-observe
      - name: Verify image contract and executable lifecycle
        working-directory: ${{ github.workspace }}
        env:
          EXPECTED_COMMIT: ${{ steps.source.outputs.commit }}
          EXPECTED_TREE: ${{ steps.source.outputs.tree }}
        run: |
          image=bitmagnet-dht-observe:ci
          inspect="$(mktemp)"
          docker image inspect "$image" | tee "$inspect"
          jq -e --arg commit "$EXPECTED_COMMIT" --arg tree "$EXPECTED_TREE" '
            length == 1 and
            .[0].Os == "linux" and
            .[0].Architecture == "amd64" and
            .[0].Config.User == "65532:65532" and
            .[0].Config.Entrypoint == ["/usr/local/bin/bitmagnet-dht-observe"] and
            (.[0].Config.Cmd == null or .[0].Config.Cmd == []) and
            .[0].Config.StopSignal == "SIGTERM" and
            (.[0].Config.ExposedPorts | keys) == ["3333/tcp", "3334/udp", "9090/tcp"] and
            .[0].Config.Labels["org.opencontainers.image.source"] == "https://github.com/dashed/bitmagnet" and
            .[0].Config.Labels["org.opencontainers.image.revision"] == $commit and
            .[0].Config.Labels["io.bitmagnet.source-tree"] == $tree and
            .[0].Config.Labels["io.bitmagnet.dht-mode"] == "observe-only" and
            .[0].Config.Labels["io.bitmagnet.dht-observe-contract"] == "observe-only/v1" and
            (.[0].Config.Env | index("BITMAGNET_SOURCE_COMMIT=" + $commit)) != null and
            (.[0].Config.Env | index("BITMAGNET_SOURCE_TREE=" + $tree)) != null and
            (.[0].Config.Env | index("HTTP_SERVER_LOCAL_ADDRESS=0.0.0.0:3333")) != null
          ' "$inspect"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65532:65532 "$image" --help \
            | grep -F 'Usage: bitmagnet-dht-observe'

          container="$(docker run -d --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65532:65532 \
            -e HTTP_SERVER_LOCAL_ADDRESS=127.0.0.1:3333 \
            -e DHT_SERVER_PORT=3334 \
            -e DHT_CRAWLER_SCALING_FACTOR=1 \
            -e DHT_CRAWLER_BOOTSTRAP_NODES=localhost:9 \
            -e BITMAGNET_METRICS_ADDR=127.0.0.1:9090 \
            -e BITMAGNET_DHT_OBSERVE_GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS=3 \
            -e RUST_LOG=info \
            "$image")"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 100); do
            if docker logs "$container" 2>&1 | grep -Fq 'bitmagnet-dht-observe started'; then
              break
            fi
            test "$attempt" -lt 100
            sleep 0.1
          done
          docker kill --signal TERM "$container"
          test "$(docker wait "$container")" = 0
          docker logs "$container" 2>&1 | grep -F 'bitmagnet-dht-observe stopped cleanly'

  docker-writeset-replay:
    name: docker build (write-set and tape parity replay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact source identity
        id: source
        working-directory: ${{ github.workspace }}
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: bitmagnet-rs/docker/Dockerfile.writeset-replay
          push: false
          load: true
          tags: bitmagnet-writeset-replay:ci
          build-args: |
            REVISION=${{ steps.source.outputs.commit }}
            SOURCE_TREE=${{ steps.source.outputs.tree }}
          cache-from: type=gha,scope=writeset-replay
          cache-to: type=gha,mode=max,scope=writeset-replay
      - name: Run exact Go and Rust tape parity gate
        working-directory: ${{ github.workspace }}
        run: |
          evidence_root="$(mktemp -d)"
          make classifier-tape-parity \
            PARITY_IMAGE=bitmagnet-writeset-replay:ci \
            TAPE_DIR="${{ github.workspace }}/testdata/parity/classifier-tape-rerun/example/tape" \
            OUTPUT_DIR="$evidence_root/evidence"
          jq -e '
            .schema == "bitmagnet.classifier-tape-parity/v1" and
            .reportSchema == "bitmagnet.classifier-tape-rerun/v2" and
            .recordCount == 9 and
            .reportsEqual == true and
            .goReportSha256 == .rustReportSha256
          ' "$evidence_root/evidence/receipt.json"

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Reads bitmagnet-rs/deny.toml (defaults.run working-directory is bitmagnet-rs).
      # Scoped to licenses/bans/sources for a stable Phase-0 baseline; the
      # `advisories` check is deferred (RustSec DB format churn otherwise flaps
      # the gate) and re-enabled in a later phase.
      - run: cargo deny check licenses bans sources

  test-pg:
    name: live-PG integration (db + queue + processor + DHT + GraphQL + Torznab)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bitmagnet
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      # sslmode=disable: the alpine PG service speaks plaintext on localhost, and
      # goose (lib/pq) otherwise defaults to sslmode=require.
      BITMAGNET_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/bitmagnet?sslmode=disable
      BITMAGNET_QUEUE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bitmagnet?sslmode=disable
      BITMAGNET_PROCESSOR_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bitmagnet?sslmode=disable
      BITMAGNET_DHT_CRAWLER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bitmagnet?sslmode=disable
      BITMAGNET_GRAPHQL_TEST_DATABASE_URL: postgres://bitmagnet_graphql_reader_ci:graphql-reader-ci-only@localhost:5432/bitmagnet?sslmode=disable
      BITMAGNET_TORZNAB_TEST_DATABASE_URL: postgres://bitmagnet_torznab_reader_ci:torznab-reader-ci-only@localhost:5432/bitmagnet?sslmode=disable
      POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/bitmagnet?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.6"
      - name: Apply goose migrations (the Go schema is the source of truth)
        working-directory: ${{ github.workspace }}
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.24.1
          "$(go env GOPATH)/bin/goose" -dir migrations postgres "$BITMAGNET_POSTGRES_DSN" up
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bitmagnet-rs
      - name: Run process_torrent_batch PostgreSQL differential
        working-directory: ${{ github.workspace }}
        run: |
          go test -tags integration -count=1 ./internal/parity \
            -run '^TestGenerateQueueBatchSelectionPgFixture$'
          cargo test --manifest-path bitmagnet-rs/Cargo.toml \
            -p bitmagnet-queue --test batch_selection_pg -- \
            --ignored --exact batch_selection_matches_go_postgres_oracle \
            --test-threads=1
      # These #[ignore]d tests connect to the migrated schema. The queue gate
      # truncates queue_jobs, so the CI service must remain disposable.
      - name: Run live-PG (ignored) tests
        run: |
          cargo test -p bitmagnet-db -- --ignored
          cargo test -p bitmagnet-dht-crawler --test pipeline_pg -- --ignored --test-threads=1
          cargo test -p bitmagnet-queue --test queue_pg -- --ignored --test-threads=1
          cargo test -p bitmagnet-processor --test persist_pg -- --ignored --test-threads=1
      - name: Run GraphQL torrent.files PostgreSQL parity
        working-directory: ${{ github.workspace }}
        run: |
          go test -tags integration -count=1 ./internal/gql/gqlmodel \
            -run '^TestGenerateTorrentFilesParityPgFixtures$'
          psql "$POSTGRES_DSN" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE bitmagnet_graphql_reader_ci
            LOGIN PASSWORD 'graphql-reader-ci-only'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS
            CONNECTION LIMIT 4;
          GRANT CONNECT ON DATABASE bitmagnet TO bitmagnet_graphql_reader_ci;
          GRANT USAGE ON SCHEMA public TO bitmagnet_graphql_reader_ci;
          GRANT SELECT ON goose_db_version, torrents, torrent_file_summary, torrent_sources
            TO bitmagnet_graphql_reader_ci;
          SQL
          cargo test --manifest-path bitmagnet-rs/Cargo.toml \
            -p bitmagnet-graphql --test torrent_files_pg -- \
            --ignored --exact real_pg_torrent_files_matches_go_without_mutation \
            --test-threads=1
      # Run last: the Go oracle deliberately recreates and leaves the disposable
      # schema for the Rust real-router process.
      - name: Run Torznab real-router PostgreSQL parity
        working-directory: ${{ github.workspace }}
        run: |
          go test -tags integration -count=1 ./internal/torznab \
            -run '^TestGenerateTorznabParityPgFixtures$'
          psql "$POSTGRES_DSN" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE bitmagnet_torznab_reader_ci
            LOGIN PASSWORD 'torznab-reader-ci-only'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS
            CONNECTION LIMIT 4;
          GRANT CONNECT ON DATABASE bitmagnet TO bitmagnet_torznab_reader_ci;
          GRANT USAGE ON SCHEMA public TO bitmagnet_torznab_reader_ci;
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO bitmagnet_torznab_reader_ci;
          SQL
          cargo test --manifest-path bitmagnet-rs/Cargo.toml \
            -p bitmagnet-torznab --test parity_pg -- \
            --ignored --exact real_pg_router_matches_go_goldens_without_mutation \
            --test-threads=1
