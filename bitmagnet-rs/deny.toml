# cargo-deny config for the bitmagnet-rs workspace (Phase-0 B5 baseline).
#
# Intent: a PERMISSIVE-licenses allow-list gate (fail the build only on a
# license outside the OSI-permissive set below) plus advisory/source hygiene as
# warnings, so the lane is green today and can be tightened in a later phase.
#
# Run locally from bitmagnet-rs/:  cargo deny check

[graph]
all-features = true

[licenses]
# v2 schema: any license NOT in `allow` fails the check.
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "0BSD",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]

[bans]
# Duplicate transitive versions are common and not worth failing CI over yet.
multiple-versions = "allow"
wildcards = "allow"

[advisories]
version = 2
# TODO(phase-N): tighten `yanked` to "deny" once the tree is triaged.
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "allow"
