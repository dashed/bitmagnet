[package]
name = "bitmagnet-search-serve"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
bitmagnet-common = { path = "../bitmagnet-common" }
bitmagnet-model = { path = "../bitmagnet-model" }
bitmagnet-proto = { path = "../bitmagnet-proto" }
bitmagnet-search-query = { path = "../bitmagnet-search-query" }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prometheus = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true, features = ["transport"] }
tonic-prost = { workspace = true }
tower = "0.5"
tracing = { workspace = true }

[lints]
workspace = true
