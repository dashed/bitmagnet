[package]
name = "bitmagnet-torznab"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "bitmagnet-torznab"
path = "src/main.rs"

[dependencies]
bitmagnet-common = { path = "../bitmagnet-common" }
bitmagnet-db = { path = "../bitmagnet-db" }
bitmagnet-search-query = { path = "../bitmagnet-search-query" }
anyhow = { workspace = true }
async-trait = "0.1"
axum = "0.8"
chrono = "0.4"
clap = { workspace = true, features = ["env"] }
form_urlencoded = "1"
prometheus.workspace = true
serde = { workspace = true }
sqlx.workspace = true
thiserror = { workspace = true }
tokio = { workspace = true }
tracing.workspace = true

[dev-dependencies]
# The Lane G golden parity test parses the crate's raw `encoding/xml`-shaped
# output and re-serialises it to the canonical normal form (a Rust port of
# `internal/parity/torznab_xml.go`) for byte comparison; the production
# serializer is hand-rolled for byte-exact Go parity, so quick-xml is test-only.
quick-xml = "0.39"
serde = { workspace = true }
serde_json = { workspace = true }
tower = { version = "0.5", features = ["util"] }
# Re-declared from the normal deps so the golden integration test can reuse the
# crate's HTTP param parser and name Lane Q's value types when building fixtures.
bitmagnet-search-query = { path = "../bitmagnet-search-query" }
form_urlencoded = "1"
# The golden fixtures key each torrent's info hash as sha1(fixture-id), matching
# Lane G's Go seed (`torznabFixtureInfoHash`).
sha1 = "0.10"
