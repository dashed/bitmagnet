name: Rust

# Rust workspace lives under bitmagnet-rs/ in this polyglot monorepo, so this
# pipeline is scoped to that subtree, the shared Go/Rust tape parity surface,
# and to its own workflow file.
#
# Future work: the Go pipeline (.github/workflows/checks.yml) runs inside
# `nix develop` + `task`. Once the Rust toolchain is added to the repo's Nix
# flake and Taskfile, these jobs should converge on the same `nix develop`
# invocation instead of dtolnay/rust-toolchain + arduino/setup-protoc.

on:
  push:
    branches: [main, develop, alberto/my-fork]
    paths:
      - "bitmagnet-rs/**"
      - "go.mod"
      - "go.sum"
      - "**/*.go"
      - "main.go"
      - "internal/app/cmd/classifiercmd/**"
      - "internal/classifier/**"
      - "internal/gql/**"
      - "internal/model/**"
      - "internal/processor/**"
      - "internal/tape/**"
      - "migrations/**"
      - "testdata/parity/classifier-attach/**"
      - "testdata/parity/classifier-tape-rerun/**"
      - "testdata/parity/graphql-torrent-files/**"
      - "testdata/parity/graphql-torrent-tags/**"
      - "testdata/parity/graphql-metrics/**"
      - "testdata/parity/queue/**"
      - "testdata/parity/searchquery/**"
      - "testdata/parity/torznab/**"
      - "testdata/parity/migrations.golden"
      - "Makefile"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "bitmagnet-rs/**"
      - "go.mod"
      - "go.sum"
      - "**/*.go"
      - "main.go"
      - "internal/app/cmd/classifiercmd/**"
      - "internal/classifier/**"
      - "internal/gql/**"
      - "internal/model/**"
      - "internal/processor/**"
      - "internal/tape/**"
      - "migrations/**"
      - "testdata/parity/classifier-attach/**"
      - "testdata/parity/classifier-tape-rerun/**"
      - "testdata/parity/graphql-torrent-files/**"
      - "testdata/parity/graphql-torrent-tags/**"
      - "testdata/parity/graphql-metrics/**"
      - "testdata/parity/queue/**"
      - "testdata/parity/searchquery/**"
      - "testdata/parity/torznab/**"
      - "testdata/parity/migrations.golden"
      - "Makefile"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: bitmagnet-rs

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bitmagnet-rs
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bitmagnet-rs
      - run: cargo test --workspace

  docker:
    name: docker build (search sidecar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: bitmagnet-rs
          file: bitmagnet-rs/docker/Dockerfile.search
          push: false
          tags: bitmagnet-search:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-filesearch:
    name: docker build (filesearch sidecar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: bitmagnet-rs
          file: bitmagnet-rs/docker/Dockerfile.filesearch
          push: false
          tags: bitmagnet-filesearch:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-graphql:
    name: docker build and smoke (GraphQL read API)
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.export.outputs.artifact-name }}
      archive-sha256: ${{ steps.export.outputs.archive-sha256 }}
      builder-attempt: ${{ steps.export.outputs.builder-attempt }}
      image-id: ${{ steps.export.outputs.image-id }}
      source-commit: ${{ steps.source.outputs.commit }}
      source-tree: ${{ steps.source.outputs.tree }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Resolve exact source identity
        id: source
        working-directory: ${{ github.workspace }}
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: bitmagnet-rs
          file: bitmagnet-rs/docker/Dockerfile.graphql
          platforms: linux/amd64
          push: false
          load: true
          tags: bitmagnet-graphql:ci
          build-args: |
            REVISION=${{ steps.source.outputs.commit }}
            SOURCE_TREE=${{ steps.source.outputs.tree }}
          cache-from: type=gha,scope=graphql
          cache-to: type=gha,mode=max,scope=graphql
      - name: Verify image contract and executable smoke
        working-directory: ${{ github.workspace }}
        env:
          EXPECTED_COMMIT: ${{ steps.source.outputs.commit }}
          EXPECTED_TREE: ${{ steps.source.outputs.tree }}
        run: |
          image=bitmagnet-graphql:ci
          inspect="$(mktemp)"
          docker image inspect "$image" | tee "$inspect"
          jq -e --arg commit "$EXPECTED_COMMIT" --arg tree "$EXPECTED_TREE" '
            length == 1 and
            .[0].Os == "linux" and
            .[0].Architecture == "amd64" and
            .[0].Config.User == "65532:65532" and
            .[0].Config.Entrypoint == ["/usr/local/bin/bitmagnet-graphql"] and
            (.[0].Config.Cmd == null or .[0].Config.Cmd == []) and
            (.[0].Config.ExposedPorts | keys) == ["3337/tcp", "9090/tcp"] and
            .[0].Config.Labels["org.opencontainers.image.source"] == "https://github.com/dashed/bitmagnet" and
            .[0].Config.Labels["org.opencontainers.image.revision"] == $commit and
            .[0].Config.Labels["io.bitmagnet.source-tree"] == $tree and
            .[0].Config.Labels["io.bitmagnet.graphql-mode"] == "read-only" and
            .[0].Config.Labels["io.bitmagnet.graphql-read-contract"] == "read-only/v1" and
            (.[0].Config.Env | index("BITMAGNET_SOURCE_COMMIT=" + $commit)) != null and
            (.[0].Config.Env | index("BITMAGNET_SOURCE_TREE=" + $tree)) != null
          ' "$inspect"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65532:65532 "$image" --help \
            | grep -F 'Usage: bitmagnet-graphql'
      - name: Export verified image for guarded publication
        id: export
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_TREE: ${{ steps.source.outputs.tree }}
        run: |
          artifact_dir="$RUNNER_TEMP/bitmagnet-graphql-image"
          archive="$artifact_dir/bitmagnet-graphql.tar"
          builder_attempt="$GITHUB_RUN_ATTEMPT"
          artifact_name="graphql-image-${SOURCE_COMMIT}-attempt-${builder_attempt}"
          printf '%s' "$builder_attempt" | grep -Eq '^[1-9][0-9]*$'
          mkdir -p "$artifact_dir"
          docker image save --output "$archive" bitmagnet-graphql:ci
          image_id="$(docker image inspect --format '{{.Id}}' bitmagnet-graphql:ci)"
          archive_sha256="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          jq -n \
            --arg schema "bitmagnet.graphql-image-build/v1" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg sourceTree "$SOURCE_TREE" \
            --arg imageId "$image_id" \
            --arg archiveSha256 "$archive_sha256" \
            --argjson builderAttempt "$builder_attempt" \
            '{
              schema: $schema,
              sourceCommit: $sourceCommit,
              sourceTree: $sourceTree,
              imageId: $imageId,
              archiveSha256: $archiveSha256,
              builderAttempt: $builderAttempt
            }' > "$artifact_dir/build-receipt.json"
          printf '%s  %s\n' "$archive_sha256" "bitmagnet-graphql.tar" \
            > "$artifact_dir/bitmagnet-graphql.tar.sha256"
          {
            echo "artifact-name=$artifact_name"
            echo "archive-sha256=$archive_sha256"
            echo "builder-attempt=$builder_attempt"
            echo "image-id=$image_id"
          } >> "$GITHUB_OUTPUT"
      - name: Upload verified image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # A rerun gets a fresh artifact even if cancellation interrupted a
          # previous attempt after its upload completed.
          name: ${{ steps.export.outputs.artifact-name }}
          path: ${{ runner.temp }}/bitmagnet-graphql-image
          if-no-files-found: error
          retention-days: 1

  publish-graphql:
    name: publish digest-authoritative GraphQL read API image
    if: >-
      success() &&
      github.repository == 'dashed/bitmagnet' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/alberto/my-fork'
    needs:
      - docker-graphql
      - fmt
      - clippy
      - test
      - cargo-deny
      - test-pg
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/dashed/bitmagnet-graphql
      BUILD_ARTIFACT_NAME: ${{ needs.docker-graphql.outputs.artifact-name }}
      BUILDER_ATTEMPT: ${{ needs.docker-graphql.outputs.builder-attempt }}
      SOURCE_COMMIT: ${{ needs.docker-graphql.outputs.source-commit }}
      SOURCE_TREE: ${{ needs.docker-graphql.outputs.source-tree }}
      EXPECTED_ARCHIVE_SHA256: ${{ needs.docker-graphql.outputs.archive-sha256 }}
      EXPECTED_IMAGE_ID: ${{ needs.docker-graphql.outputs.image-id }}
    steps:
      - name: Download verified image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # Use the builder's output verbatim. A failed-job retry increments the
          # publisher attempt without rerunning a successful builder.
          name: ${{ needs.docker-graphql.outputs.artifact-name }}
          path: ${{ runner.temp }}/bitmagnet-graphql-image
      - name: Verify and load exact smoked image
        working-directory: ${{ runner.temp }}/bitmagnet-graphql-image
        run: |
          test "$SOURCE_COMMIT" = "$GITHUB_SHA"
          printf '%s' "$BUILDER_ATTEMPT" | grep -Eq '^[1-9][0-9]*$'
          test "$BUILD_ARTIFACT_NAME" \
            = "graphql-image-${SOURCE_COMMIT}-attempt-${BUILDER_ATTEMPT}"
          printf '%s' "$SOURCE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$SOURCE_TREE" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$EXPECTED_ARCHIVE_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          printf '%s' "$EXPECTED_IMAGE_ID" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf '%s  %s\n' "$EXPECTED_ARCHIVE_SHA256" "bitmagnet-graphql.tar" \
            | sha256sum --check --strict -
          jq -e \
            --arg commit "$SOURCE_COMMIT" \
            --arg tree "$SOURCE_TREE" \
            --arg imageId "$EXPECTED_IMAGE_ID" \
            --arg archiveSha256 "$EXPECTED_ARCHIVE_SHA256" \
            --argjson builderAttempt "$BUILDER_ATTEMPT" \
            '.schema == "bitmagnet.graphql-image-build/v1" and
             .sourceCommit == $commit and
             .sourceTree == $tree and
             .imageId == $imageId and
             .archiveSha256 == $archiveSha256 and
             .builderAttempt == $builderAttempt' \
            build-receipt.json
          docker image load --input bitmagnet-graphql.tar
          test "$(docker image inspect --format '{{.Id}}' bitmagnet-graphql:ci)" \
            = "$EXPECTED_IMAGE_ID"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify immutable digest
        id: publish
        working-directory: ${{ runner.temp }}/bitmagnet-graphql-image
        run: |
          image_ref="$IMAGE_REPOSITORY:$SOURCE_COMMIT"
          tag_state=pushed
          inspect_error="$(mktemp)"
          # The full-SHA tag is a mutable convenience reference. A prior
          # attempt may already have pushed it before cancellation, so reuse is
          # accepted only when the digest pull below matches the smoked image.
          if remote_inspect="$(docker buildx imagetools inspect "$image_ref" 2>"$inspect_error")"; then
            tag_state=reused
          elif ! grep -Eqi 'manifest unknown|not found' "$inspect_error"; then
            cat "$inspect_error" >&2
            exit 1
          else
            docker image tag bitmagnet-graphql:ci "$image_ref"
            docker image push "$image_ref"
            remote_inspect="$(docker buildx imagetools inspect "$image_ref")"
          fi
          printf '%s\n' "$remote_inspect"
          digest="$(printf '%s\n' "$remote_inspect" | awk '$1 == "Digest:" { print $2; exit }')"
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'

          # Only this digest-qualified reference is deployment authority.
          immutable_ref="$IMAGE_REPOSITORY@$digest"
          docker buildx imagetools inspect "$immutable_ref"
          docker image pull "$immutable_ref"
          inspect="$(mktemp)"
          docker image inspect "$immutable_ref" | tee "$inspect"
          jq -e \
            --arg commit "$SOURCE_COMMIT" \
            --arg tree "$SOURCE_TREE" \
            --arg imageId "$EXPECTED_IMAGE_ID" \
            --arg immutableRef "$immutable_ref" '
              length == 1 and
              .[0].Id == $imageId and
              (.[0].RepoDigests | index($immutableRef)) != null and
              .[0].Os == "linux" and
              .[0].Architecture == "amd64" and
              .[0].Config.Labels["org.opencontainers.image.revision"] == $commit and
              .[0].Config.Labels["io.bitmagnet.source-tree"] == $tree and
              .[0].Config.Labels["io.bitmagnet.graphql-mode"] == "read-only" and
              .[0].Config.Labels["io.bitmagnet.graphql-read-contract"] == "read-only/v1" and
              (.[0].Config.Env | index("BITMAGNET_SOURCE_COMMIT=" + $commit)) != null and
              (.[0].Config.Env | index("BITMAGNET_SOURCE_TREE=" + $tree)) != null
            ' "$inspect"

          final_tag_inspect="$(docker buildx imagetools inspect "$image_ref")"
          printf '%s\n' "$final_tag_inspect"
          final_tag_digest="$(printf '%s\n' "$final_tag_inspect" \
            | awk '$1 == "Digest:" { print $2; exit }')"
          test "$final_tag_digest" = "$digest"

          jq -n \
            --arg schema "bitmagnet.graphql-image-publication/v2" \
            --arg imageRepository "$IMAGE_REPOSITORY" \
            --arg tag "$SOURCE_COMMIT" \
            --arg tagRef "$image_ref" \
            --arg tagPolicy "mutable-convenience-only" \
            --arg deploymentAuthority "digest" \
            --arg digest "$digest" \
            --arg immutableRef "$immutable_ref" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg sourceTree "$SOURCE_TREE" \
            --arg imageId "$EXPECTED_IMAGE_ID" \
            --arg archiveSha256 "$EXPECTED_ARCHIVE_SHA256" \
            --arg tagState "$tag_state" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson builderAttempt "$BUILDER_ATTEMPT" \
            --argjson publisherAttempt "$GITHUB_RUN_ATTEMPT" \
            '{
              schema: $schema,
              imageRepository: $imageRepository,
              tag: $tag,
              tagRef: $tagRef,
              tagPolicy: $tagPolicy,
              deploymentAuthority: $deploymentAuthority,
              digest: $digest,
              immutableRef: $immutableRef,
              sourceCommit: $sourceCommit,
              sourceTree: $sourceTree,
              imageId: $imageId,
              archiveSha256: $archiveSha256,
              tagState: $tagState,
              workflowRun: $workflowRun,
              builderAttempt: $builderAttempt,
              publisherAttempt: $publisherAttempt
            }' > publication-receipt.json
          {
            echo '### GraphQL image publication'
            echo
            echo "- Source commit: \`$SOURCE_COMMIT\`"
            echo "- Source tree: \`$SOURCE_TREE\`"
            echo "- Deployment authority: \`$immutable_ref\`"
            echo "- Full-SHA tag (mutable convenience): \`$image_ref\` (\`$tag_state\`)"
            echo "- Builder attempt: \`$BUILDER_ATTEMPT\`"
            echo "- Publisher attempt: \`$GITHUB_RUN_ATTEMPT\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "immutable-ref=$immutable_ref" >> "$GITHUB_OUTPUT"
      - name: Upload publication receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: graphql-publication-${{ needs.docker-graphql.outputs.source-commit }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bitmagnet-graphql-image/publication-receipt.json
          if-no-files-found: error
          retention-days: 90

  docker-ingest-shadow:
    name: docker build (ingest shadow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact source identity
        id: source
        working-directory: ${{ github.workspace }}
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: bitmagnet-rs/docker/Dockerfile.ingest-shadow
          push: false
          tags: bitmagnet-ingest-shadow:ci
          build-args: |
            REVISION=${{ steps.source.outputs.commit }}
            SOURCE_TREE=${{ steps.source.outputs.tree }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-process-torrent-batch:
    name: docker build and smoke (process_torrent_batch worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact source identity
        id: source
        working-directory: ${{ github.workspace }}
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: bitmagnet-rs/docker/Dockerfile.process-torrent-batch
          platforms: linux/amd64
          push: false
          load: true
          tags: bitmagnet-process-torrent-batch:ci
          build-args: |
            REVISION=${{ steps.source.outputs.commit }}
            SOURCE_TREE=${{ steps.source.outputs.tree }}
          cache-from: type=gha,scope=process-torrent-batch
          cache-to: type=gha,mode=max,scope=process-torrent-batch
      - name: Verify image contract and executable smoke
        working-directory: ${{ github.workspace }}
        env:
          EXPECTED_COMMIT: ${{ steps.source.outputs.commit }}
          EXPECTED_TREE: ${{ steps.source.outputs.tree }}
        run: |
          image=bitmagnet-process-torrent-batch:ci
          inspect="$(mktemp)"
          docker image inspect "$image" | tee "$inspect"
          jq -e --arg commit "$EXPECTED_COMMIT" --arg tree "$EXPECTED_TREE" '
            length == 1 and
            .[0].Os == "linux" and
            .[0].Architecture == "amd64" and
            .[0].Config.User == "65532:65532" and
            .[0].Config.Entrypoint == ["/usr/local/bin/bitmagnet-process-torrent-batch"] and
            (.[0].Config.Cmd == null or .[0].Config.Cmd == []) and
            (.[0].Config.ExposedPorts | keys) == ["9090/tcp"] and
            .[0].Config.Labels["org.opencontainers.image.source"] == "https://github.com/dashed/bitmagnet" and
            .[0].Config.Labels["org.opencontainers.image.revision"] == $commit and
            .[0].Config.Labels["io.bitmagnet.source-tree"] == $tree and
            .[0].Config.Labels["io.bitmagnet.queue-consumer"] == "process_torrent_batch" and
            .[0].Config.Labels["io.bitmagnet.queue-consumer-contract"] == "process_torrent_batch/v1" and
            (.[0].Config.Env | index("BITMAGNET_SOURCE_COMMIT=" + $commit)) != null and
            (.[0].Config.Env | index("BITMAGNET_SOURCE_TREE=" + $tree)) != null
          ' "$inspect"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65532:65532 "$image" --help \
            | grep -F 'Usage: bitmagnet-process-torrent-batch'

  docker-dht-observe:
    name: docker build and smoke (DHT observer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact source identity
        id: source
        working-directory: ${{ github.workspace }}
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: bitmagnet-rs
          file: bitmagnet-rs/docker/Dockerfile.dht-observe
          platforms: linux/amd64
          push: false
          load: true
          tags: bitmagnet-dht-observe:ci
          build-args: |
            REVISION=${{ steps.source.outputs.commit }}
            SOURCE_TREE=${{ steps.source.outputs.tree }}
          cache-from: type=gha,scope=dht-observe
          cache-to: type=gha,mode=max,scope=dht-observe
      - name: Verify image contract and executable lifecycle
        working-directory: ${{ github.workspace }}
        env:
          EXPECTED_COMMIT: ${{ steps.source.outputs.commit }}
          EXPECTED_TREE: ${{ steps.source.outputs.tree }}
        run: |
          image=bitmagnet-dht-observe:ci
          inspect="$(mktemp)"
          docker image inspect "$image" | tee "$inspect"
          jq -e --arg commit "$EXPECTED_COMMIT" --arg tree "$EXPECTED_TREE" '
            length == 1 and
            .[0].Os == "linux" and
            .[0].Architecture == "amd64" and
            .[0].Config.User == "65532:65532" and
            .[0].Config.Entrypoint == ["/usr/local/bin/bitmagnet-dht-observe"] and
            (.[0].Config.Cmd == null or .[0].Config.Cmd == []) and
            .[0].Config.StopSignal == "SIGTERM" and
            (.[0].Config.ExposedPorts | keys) == ["3333/tcp", "3334/udp", "9090/tcp"] and
            .[0].Config.Labels["org.opencontainers.image.source"] == "https://github.com/dashed/bitmagnet" and
            .[0].Config.Labels["org.opencontainers.image.revision"] == $commit and
            .[0].Config.Labels["io.bitmagnet.source-tree"] == $tree and
            .[0].Config.Labels["io.bitmagnet.dht-mode"] == "observe-only" and
            .[0].Config.Labels["io.bitmagnet.dht-observe-contract"] == "observe-only/v1" and
            (.[0].Config.Env | index("BITMAGNET_SOURCE_COMMIT=" + $commit)) != null and
            (.[0].Config.Env | index("BITMAGNET_SOURCE_TREE=" + $tree)) != null and
            (.[0].Config.Env | index("HTTP_SERVER_LOCAL_ADDRESS=0.0.0.0:3333")) != null
          ' "$inspect"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65532:65532 "$image" --help \
            | grep -F 'Usage: bitmagnet-dht-observe'

          container="$(docker run -d --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65532:65532 \
            -e HTTP_SERVER_LOCAL_ADDRESS=127.0.0.1:3333 \
            -e DHT_SERVER_PORT=3334 \
            -e DHT_CRAWLER_SCALING_FACTOR=1 \
            -e DHT_CRAWLER_BOOTSTRAP_NODES=localhost:9 \
            -e BITMAGNET_METRICS_ADDR=127.0.0.1:9090 \
            -e BITMAGNET_DHT_OBSERVE_GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS=3 \
            -e RUST_LOG=info \
            "$image")"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 100); do
            if docker logs "$container" 2>&1 | grep -Fq 'bitmagnet-dht-observe started'; then
              break
            fi
            test "$attempt" -lt 100
            sleep 0.1
          done
          docker kill --signal TERM "$container"
          test "$(docker wait "$container")" = 0
          docker logs "$container" 2>&1 | grep -F 'bitmagnet-dht-observe stopped cleanly'

  docker-writeset-replay:
    name: docker build (write-set and tape parity replay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact source identity
        id: source
        working-directory: ${{ github.workspace }}
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: bitmagnet-rs/docker/Dockerfile.writeset-replay
          push: false
          load: true
          tags: bitmagnet-writeset-replay:ci
          build-args: |
            REVISION=${{ steps.source.outputs.commit }}
            SOURCE_TREE=${{ steps.source.outputs.tree }}
          cache-from: type=gha,scope=writeset-replay
          cache-to: type=gha,mode=max,scope=writeset-replay
      - name: Run exact Go and Rust tape parity gate
        working-directory: ${{ github.workspace }}
        run: |
          evidence_root="$(mktemp -d)"
          make classifier-tape-parity \
            PARITY_IMAGE=bitmagnet-writeset-replay:ci \
            TAPE_DIR="${{ github.workspace }}/testdata/parity/classifier-tape-rerun/example/tape" \
            OUTPUT_DIR="$evidence_root/evidence"
          jq -e '
            .schema == "bitmagnet.classifier-tape-parity/v1" and
            .reportSchema == "bitmagnet.classifier-tape-rerun/v2" and
            .recordCount == 9 and
            .reportsEqual == true and
            .goReportSha256 == .rustReportSha256
          ' "$evidence_root/evidence/receipt.json"

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Reads bitmagnet-rs/deny.toml (defaults.run working-directory is bitmagnet-rs).
      # Scoped to licenses/bans/sources for a stable Phase-0 baseline; the
      # `advisories` check is deferred (RustSec DB format churn otherwise flaps
      # the gate) and re-enabled in a later phase.
      - run: cargo deny check licenses bans sources

  test-pg:
    name: live-PG integration (db + queue + processor + DHT + GraphQL + Torznab)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bitmagnet
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      # sslmode=disable: the alpine PG service speaks plaintext on localhost, and
      # goose (lib/pq) otherwise defaults to sslmode=require.
      BITMAGNET_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/bitmagnet?sslmode=disable
      BITMAGNET_QUEUE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bitmagnet?sslmode=disable
      BITMAGNET_PROCESSOR_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bitmagnet?sslmode=disable
      BITMAGNET_DHT_CRAWLER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bitmagnet_writer_gate?sslmode=disable
      BITMAGNET_GRAPHQL_TEST_DATABASE_URL: postgres://bitmagnet_graphql_reader_ci:graphql-reader-ci-only@localhost:5432/bitmagnet?sslmode=disable
      BITMAGNET_GRAPHQL_METRICS_TEST_DATABASE_URL: postgres://bitmagnet_graphql_metrics_reader_ci:graphql-metrics-reader-ci-only@localhost:5432/bitmagnet?sslmode=disable
      BITMAGNET_GRAPHQL_FULL_READER_TEST_DATABASE_URL: postgres://bitmagnet_graphql_full_reader_ci:graphql-full-reader-ci-only@localhost:5432/bitmagnet?sslmode=disable
      BITMAGNET_TORZNAB_TEST_DATABASE_URL: postgres://bitmagnet_torznab_reader_ci:torznab-reader-ci-only@localhost:5432/bitmagnet?sslmode=disable
      POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/bitmagnet?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.6"
      - name: Apply goose migrations (the Go schema is the source of truth)
        working-directory: ${{ github.workspace }}
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.24.1
          "$(go env GOPATH)/bin/goose" -dir migrations postgres "$BITMAGNET_POSTGRES_DSN" up
          psql -X 'postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable' \
            -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE bitmagnet_writer_gate'
          "$(go env GOPATH)/bin/goose" -dir migrations postgres \
            "$BITMAGNET_DHT_CRAWLER_TEST_DATABASE_URL" up
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bitmagnet-rs
      - name: Run process_torrent_batch PostgreSQL differential
        working-directory: ${{ github.workspace }}
        run: |
          go test -tags integration -count=1 ./internal/parity \
            -run '^TestGenerateQueueBatchSelectionPgFixture$'
          cargo test --manifest-path bitmagnet-rs/Cargo.toml \
            -p bitmagnet-queue --test batch_selection_pg -- \
            --ignored --exact batch_selection_matches_go_postgres_oracle \
            --test-threads=1
      # These #[ignore]d tests connect to the migrated schema. The queue gate
      # truncates queue_jobs, so the CI service must remain disposable.
      - name: Run live-PG (ignored) tests
        run: |
          cargo test -p bitmagnet-db -- --ignored
          cargo test -p bitmagnet-dht-crawler --test pipeline_pg -- --ignored --test-threads=1
          cargo test -p bitmagnet-queue --test queue_pg -- --ignored --test-threads=1
          cargo test -p bitmagnet-processor --test persist_pg -- --ignored --test-threads=1
      - name: Run GraphQL PostgreSQL read parity
        working-directory: ${{ github.workspace }}
        run: |
          go test -tags integration -count=1 ./internal/gql/gqlmodel \
            -run '^TestGenerateTorrentFilesParityPgFixtures$'
          psql "$POSTGRES_DSN" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE bitmagnet_graphql_reader_ci
            LOGIN PASSWORD 'graphql-reader-ci-only'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS
            CONNECTION LIMIT 4;
          GRANT CONNECT ON DATABASE bitmagnet TO bitmagnet_graphql_reader_ci;
          GRANT USAGE ON SCHEMA public TO bitmagnet_graphql_reader_ci;
          -- Current direct-reader union for the one runtime pool. Search-reader
          -- activation remains blocked on its later, separately reviewed expansion.
          GRANT SELECT ON goose_db_version, queue_jobs, torrents, torrent_file_summary, torrent_sources, torrent_tags
            TO bitmagnet_graphql_reader_ci;
          SQL
          cargo test --manifest-path bitmagnet-rs/Cargo.toml \
            -p bitmagnet-graphql --test torrent_files_pg -- \
            --ignored --exact real_pg_graphql_reads_match_go_without_mutation \
            --test-threads=1
          cargo test --manifest-path bitmagnet-rs/Cargo.toml \
            -p bitmagnet-graphql --test queue_jobs_pg -- \
            --ignored --exact real_pg_queue_jobs_matches_go_without_mutation \
            --test-threads=1
      - name: Run full GraphQL reader authority gate
        working-directory: ${{ github.workspace }}
        run: |
          go test -tags integration -count=1 ./internal/parity \
            -run '^TestGeneratePhase2SearchQueryParityFixtures$'
          go test -tags integration -count=1 ./internal/gql/gqlmodel \
            -run '^TestGenerateGraphQLMetricsParityPg$'
          psql -X "$POSTGRES_DSN" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE bitmagnet_graphql_metrics_reader_ci
            LOGIN PASSWORD 'graphql-metrics-reader-ci-only'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS
            CONNECTION LIMIT 4;
          GRANT CONNECT ON DATABASE bitmagnet TO bitmagnet_graphql_metrics_reader_ci;
          GRANT USAGE ON SCHEMA public TO bitmagnet_graphql_metrics_reader_ci;
          GRANT SELECT ON goose_db_version, queue_jobs, torrents_torrent_sources
            TO bitmagnet_graphql_metrics_reader_ci;
          CREATE ROLE bitmagnet_graphql_full_reader_ci
            LOGIN PASSWORD 'graphql-full-reader-ci-only'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS
            CONNECTION LIMIT 4;
          GRANT CONNECT ON DATABASE bitmagnet TO bitmagnet_graphql_full_reader_ci;
          GRANT USAGE ON SCHEMA public TO bitmagnet_graphql_full_reader_ci;
          GRANT SELECT ON
            content,
            content_attributes,
            content_collections,
            content_collections_content,
            goose_db_version,
            queue_jobs,
            torrent_contents,
            torrent_file_summary,
            torrent_files,
            torrent_sources,
            torrent_tags,
            torrents,
            torrents_torrent_sources
            TO bitmagnet_graphql_full_reader_ci;
          -- PostgreSQL grants EXECUTE to PUBLIC by default. Remove that
          -- disposable-CI shortcut from every public routine so the role's
          -- sole explicit budgeted_count grant is the complete contract.
          -- Production activation requires a separate audited global ACL
          -- transition; adding the reader grant alone would leave SECURITY
          -- DEFINER mutation routines executable through PUBLIC.
          REVOKE EXECUTE ON ALL FUNCTIONS IN SCHEMA public FROM PUBLIC;
          REVOKE EXECUTE ON ALL PROCEDURES IN SCHEMA public FROM PUBLIC;
          GRANT EXECUTE ON FUNCTION public.budgeted_count(text, double precision)
            TO bitmagnet_graphql_full_reader_ci;
          SQL
          cargo test --manifest-path bitmagnet-rs/Cargo.toml \
            -p bitmagnet-graphql --test metrics_pg -- \
            --ignored --exact real_pg_metrics_match_go_without_mutation \
            --test-threads=1
          cargo test --manifest-path bitmagnet-rs/Cargo.toml \
            -p bitmagnet-graphql --test full_reader_pg -- \
            --ignored --exact full_router_uses_one_exact_reader_without_mutation \
            --test-threads=1
      # Run last: the Go oracle deliberately recreates and leaves the disposable
      # schema for the Rust real-router process.
      - name: Run Torznab real-router PostgreSQL parity
        working-directory: ${{ github.workspace }}
        run: |
          go test -tags integration -count=1 ./internal/torznab \
            -run '^TestGenerateTorznabParityPgFixtures$'
          psql "$POSTGRES_DSN" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE bitmagnet_torznab_reader_ci
            LOGIN PASSWORD 'torznab-reader-ci-only'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS
            CONNECTION LIMIT 4;
          GRANT CONNECT ON DATABASE bitmagnet TO bitmagnet_torznab_reader_ci;
          GRANT USAGE ON SCHEMA public TO bitmagnet_torznab_reader_ci;
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO bitmagnet_torznab_reader_ci;
          SQL
          cargo test --manifest-path bitmagnet-rs/Cargo.toml \
            -p bitmagnet-torznab --test parity_pg -- \
            --ignored --exact real_pg_router_matches_go_goldens_without_mutation \
            --test-threads=1
