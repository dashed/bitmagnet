<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>bitmagnet</title>
    <script>
      try {
        const stored = window.localStorage.getItem("bitmagnet-color-scheme");
        const scheme =
          stored === "light" || stored === "dark" || stored === "auto" ? stored : "auto";
        const computed =
          scheme === "auto"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : scheme;

        document.documentElement.setAttribute("data-mantine-color-scheme", computed);
      } catch {
        document.documentElement.setAttribute("data-mantine-color-scheme", "light");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
