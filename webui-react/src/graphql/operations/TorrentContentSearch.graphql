query TorrentContentSearch(
  $cached: Boolean
  $facets: TorrentContentFacetsInput
  $hasNextPage: Boolean
  $limit: Int
  $orderBy: [TorrentContentOrderByInput!]
  $page: Int
  $queryString: String
  $totalCount: Boolean
) {
  torrentContent {
    search(
      input: {
        cached: $cached
        facets: $facets
        hasNextPage: $hasNextPage
        limit: $limit
        orderBy: $orderBy
        page: $page
        queryString: $queryString
        totalCount: $totalCount
      }
    ) {
      totalCount
      totalCountIsEstimate
      hasNextPage
      items {
        infoHash
        title
        contentType
        seeders
        leechers
        dhtSeenCount
        dhtFirstSeenAt
        dhtLastSeenAt
        publishedAt
        torrent {
          fileExtensions
          filesCount
          magnetUri
          name
          size
        }
      }
      aggregations {
        contentType {
          value
          label
          count
          isEstimate
        }
        torrentSource {
          value
          label
          count
          isEstimate
        }
        torrentTag {
          value
          label
          count
          isEstimate
        }
        torrentFileType {
          value
          label
          count
          isEstimate
        }
        language {
          value
          label
          count
          isEstimate
        }
        genre {
          value
          label
          count
          isEstimate
        }
        videoResolution {
          value
          label
          count
          isEstimate
        }
        videoSource {
          value
          label
          count
          isEstimate
        }
      }
    }
  }
}
