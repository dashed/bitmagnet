[project]
name = "ps-harness"
version = "0.1.0"
description = "Latency + candidate-recall harness for the L3 bitmagnet-pathsearch gRPC sidecar (D6 gates 5+6)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "grpcio>=1.60,<2",
    "grpcio-tools>=1.60,<2",
    "protobuf>=4.25,<6",
    "psycopg[binary]>=3.1,<4",
]

[project.scripts]
ps-harness = "ps_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ps_harness"]

[dependency-groups]
dev = ["pytest>=8"]
